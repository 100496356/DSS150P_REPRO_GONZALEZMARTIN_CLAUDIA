# Lab 4 uses its own container names and host ports (5433, 8081) so it never clashes with Lab 3.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      AIRFLOW_IMAGE_NAME: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.5-python3.11}
  env_file: .env
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-dss150p}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/airflow
    PYTHONPATH: /opt/airflow/project
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - .:/opt/airflow/project
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: lab4-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dss150p}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - lab4_pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dss150p} -d dss150p"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Same user as Airflow, so files written by the CLI can later be replaced by Airflow tasks.
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab4-pipeline
    user: "${AIRFLOW_UID:-50000}:0"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      HOME: /tmp
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "src.cli", "validate-env"]

  airflow-init:
    <<: *airflow-common
    container_name: lab4-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname DSS150P --lastname Admin --role Admin --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    container_name: lab4-airflow-webserver
    command: webserver
    ports:
      - "8081:8080"

  airflow-scheduler:
    <<: *airflow-common
    container_name: lab4-airflow-scheduler
    command: scheduler

volumes:
  lab4_pgdata:
